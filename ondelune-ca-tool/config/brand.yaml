# Maison Ondelune（月澜香槟）品牌配置 —— 虚构品牌
# 对应 Brand Book v0.2 第 1、2、5、9 节。引擎只读这个文件，换品牌 = 换配置。

brand:
  name_en: Maison Ondelune
  name_cn: 月澜香槟
  founded: 1868
  positioning: 家族香槟酒庄，以年份香槟和长期窖藏著称，只在好年份出年份酒
  tagline: 时间是最好的酿酒师
  theme: 时间与时机——为客户把握饮用的最佳时刻
  voice: 像一位懂酒、有分寸的老朋友：克制、温暖、有学识但不卖弄；微信一对一口语，不是官网文案
  channel: 企业微信一对一
  price_policy: strict   # strict = 全国统一零售价，不打折不返现；promo = 允许输入中给出的官方活动（预留）
  member_benefits: [品鉴会邀请, 酒窖参观, 瓶身刻字]

# 三条候选的分工（Brand Book 第 2 节）
strategies:
  - id: warm
    name: 温度型
    brief: 从客户的个人细节切入，重关系
    max_chars: 120
  - id: content
    name: 内容型
    brief: 从这瓶酒或品牌的一个具体细节切入，重价值；知识要自然融进对话，不要「宣布」知识点（不说「小知识」）；最多 1 个专业知识点
    max_chars: 120
  - id: light
    name: 轻量型
    brief: 简短轻松，适合关系不熟或客户很忙
    max_chars: 50

# ---------- 第 1 层：硬规则参数 ----------
length:
  min_chars: 15            # 轻量型允许更短
  max_chars: 120           # V1
  max_sentences: 3         # V11（主动消息）
  reply_light_min: 25      # v2（D3）：回复类场景的轻量型不能太短
  reply_light_max: 60
punctuation:
  max_exclamations: 1      # V2
  max_emoji: 1             # V2
  emoji_whitelist: ["🥂", "🌙"]
similarity:
  max_jaccard: 0.45        # 三条两两之间的字符二元组 Jaccard 上限

# 词表均为正则。negatable: true 表示前面 4 个字内出现否定词（不/没有/无/并不/不会）时放行，
# 例如「我们不做折扣」是合规表达，「给您打个折」不是。
wordlists:
  V3_bad_address:
    rule: V3
    patterns: ["亲爱的", "亲[，,~～！!]", "^亲", "宝子", "宝宝们", "尊敬的(客户|会员|顾客)", "家人们", "姐妹们"]
  V4_promo:
    rule: V4
    patterns: ["限时", "抢购", "秒杀", "爆款", "划算", "性价比", "最后机会", "错过就没", "手慢无", "速来", "冲[！!]"]
  V5_absolute:
    rule: V5
    patterns: ["最好", "最佳", "最棒", "最优", "最顶级", "第一(?!次|口|杯|瓶)", "唯一", "绝对", "顶级", "极致", "史上", "100%"]
  V8_pressure:
    rule: V8
    patterns: ["尽快回复", "请尽快", "今天(之)?内", "马上(下单|确认|回复)", "立即", "赶快", "抓紧", "名额不多了", "过时不候"]
  R1_discount:
    rule: R1
    negatable: true
    patterns: ["打折", "折扣", "[0-9一二三四五六七八九]折", "优惠价", "内部价", "员工价", "特价", "返现", "让利", "立减", "送您一瓶", "额外(赠|送)", "赠送"]
  R4_reserve:
    rule: R4
    patterns: ["(给|帮|为)您(预)?留", "留(了)?一瓶", "锁(定)?一瓶", "还剩最后"]
  R5_drinking:
    rule: R5
    patterns: ["一醉方休", "不醉不归", "喝个痛快", "多喝", "一口闷", "豪饮", "干了这"]
  R6_health:
    rule: R6
    patterns: ["养生", "保健", "养颜", "助眠", "(对|有益)(身体|健康)", "喝.{0,6}(健康|美容|长寿)"]
  R7_minor:
    rule: R7
    patterns: ["(给|让)(孩子|宝宝|小朋友|小孩).{0,6}(喝|尝|品)"]
  R8_investment:
    rule: R8
    patterns: ["升值", "增值", "保值", "投资回报", "回报率", "稳赚", "会涨价"]
  R14_judging:
    rule: R14
    patterns: ["好久没来", "很久没(来|买|联系)", "上次(试|尝)了.{0,4}没(买|入)", "预算(不够|有限)"]
  V13_ai_tone:              # v2（D2）
    rule: V13
    patterns: ["小知识", "补充一个", "分享一个", "说件小事", "小贴士", "温馨提示", "值得一提的是", "希望对您有帮助", "首先，", "其次，", "综上", "还在时间里", "等得起", "够格出场"]
  V14_ni:                   # v2（人工标注 v1 后新增）：对客户用「您」
    rule: V14
    patterns: ["(?<!迷)你(?!们)"]
  R16_fabricated_lore:      # v2（D10）：编造出处一律禁止；真实名句由 prompt 约束用法
    rule: R16
    patterns: ["老话", "俗话说", "有句话叫", "有句老话", "香槟区的(人|说法|讲究)", "人们常说", "业内都说", "法国人常说"]
negation_words: ["不", "没有", "没", "无", "并不", "不会", "从不"]

# 庆祝类内容不宜发送的日期（R11）。键为 MM-DD 或 YYYY-MM-DD。
no_celebration_days:
  "2026-04-05": 清明节
  "2027-04-05": 清明节
# v2（R12 预检）：客户在对话中表达过拒绝或决定不买
refusal_phrases: ["不需要了", "不用了", "不买了", "(?<!预)算了", "暂时不考虑", "先不了", "别再发", "不感兴趣"]   # 正则；排除「预算了」
celebration_words: ["快乐", "庆祝", "干杯", "🥂", "开心"]

# 场景 1 可发送问候的节日（具体日期由测试用例输入给出，避免硬编码农历换算）
festivals: [元旦, 春节, 情人节, 七夕, 中秋, 圣诞]
