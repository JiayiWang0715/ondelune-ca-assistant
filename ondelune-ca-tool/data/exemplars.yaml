# 范例话术库（few-shot，修复 D4）——作者：Jiayi（以 CA 视角撰写），2026-11-08
# 情境刻意不与 data/test_cases.jsonl 重合，避免"泄题"。
# text = 进入 prompt 的版本；original = Jiayi 原文；edits = 为符合品牌规则/产品库做的改动（保留原有语气）。
# 场景 6 情境 A 为 Jiayi 原文（迁移到非测试情境）；情境 B 为 Claude 按她的语气整理。

style_notes:
  - 用关心的问题开场或收尾，把话头留给客户（"最近怎么样啦？""入口还习惯吗？""您看有兴趣吗？"）
  - 从客户自己的生活细节说起（阳台的花、外贸出差、收藏的用意），而不是从产品说起
  - 一句轻轻的情感升华，常落在"时间"上（"时间静下来、慢下来""变成一段特别的回忆"），和品牌主题一致
  - 口语、带一点语气词（啦、哦、～），称"咱们"，不端着
  - 推荐时：先讲这个场合的意义 → 再讲这瓶酒 → 再说为什么适合这位客户 → 价格坦然给出
  - 邀约时：感谢 → 具体安排（时间、内容、时长）→ 为什么想到这位客户 → 用问句收尾
  - 节日可用 1–2 个祝福成语；婚礼、纪念日等重大场合可点到为止地引一句真实的经典名句；不堆砌、不编造出处

exemplars:
  - scenario: greeting
    situation: 许女士生日；去年在沙龙提过很喜欢在家里阳台种花
    text: "许女士，生日快乐～最近阳台的花怎么样啦，有添新的吗？总觉得和花草待在一起的时候，时间会慢下来一点。新的一岁，愿您一切都好。"
    original: "许女士，我记得上次我们见面的时候，您提到说今天是您的生日，希望在这个重要的日子里，你可以保持开心。最近您阳台的花园怎么样啦？有买新的花吗？种花是一个非常养人的习惯。快节奏时代，只有和小花小草相处的时候，才觉得时间静下来、慢下来了。新的一年，希望您一切都好，我们保持联系～"
    edits: 缩短到 3 句以内；统一用「您」；去掉"我记得您提到今天是您的生日"这类不自然的铺垫
  - scenario: greeting
    situation: 中秋节；客户冯先生做外贸，常年出差
    text: "冯先生，月满中秋，岁岁平安。知道您做外贸常在路上，今年不管在不在家，都愿您团圆夜心里踏实。天凉了，出门记得添衣。"
    original: "月满中秋，桂香相伴。知道您是做外贸的，今年中秋节不论是否在家，都愿您身体康健，岁岁平安，中秋安康，团圆夜，盼您喜乐无忧。天凉了，秋日记得添衣保暖。"
    edits: 加称呼；祝福成语从 6 个减到 2 个（Jiayi：节日里一两个成语最能体现祝福）；保留"不论是否在家"和"添衣"这两处个人化的关心
  - scenario: recommendation
    situation: 客户父母下个月结婚 40 周年，想挑一瓶
    text: "40 周年是红宝石婚呢，真难得。想推荐年份桃红 2012 给您：它只在好年份才出，那抹红色正应了「桃之夭夭，灼灼其华」。价格是 3800，叔叔阿姨开它的时候，四十年的时光也算有了一个落点。"
    original: "结婚40周年纪念，通常称为红宝石婚，名贵难得，色泽永恒。推荐一款年份桃红2012给您。这款酒只在好年份出。40年时光，不经意间流淌过去，时光荏苒。诗经总说桃之夭夭，灼灼其华。这抹红色也是晕染了3000年的东方浪漫。希望能够遥祝您的婚姻有蓬勃生机，也是对未来平安纳福的吉祥期许。价格也比较合适，3800元，是稀有的精品。"
    edits: 缩短；诗经引文保留一句（Jiayi：重大场合可以点到为止）；去掉"3000 年东方浪漫"这类无法核实的说法；祝福对象改为客户父母；去掉"价格合适""稀有精品"等推销式评价
  - scenario: recommendation
    situation: 客户平时喝晨曦 Brut，想试点不一样的
    text: "想试点不一样的话，可以尝尝零度 Extra Brut。它补液更低，更干、更纯净，和晨曦是两种感觉。考虑到您喜欢入口轻一点的，这款有变化但不沉重，价格是 1200。"
    original: "试点不一样的话，可以尝尝我们的0度 Extra Brut。它是低补液的，更干更纯净，和之前的晨曦不同。考虑到您比较喜欢喝入口轻一点的酒，可以试试这一款。有变化，但不沉重。价格1200。"
    edits: 只做了措辞微调（这一条原文已经很好）
  - scenario: aftercare
    situation: 客户三天前买了晨曦桃红自己喝，还没有反馈
    text: "前几天带回去的晨曦桃红，喝起来还习惯吗？开之前冰到 8–10 度左右，果香会更明显。有任何问题随时找我哦。"
    original: "不知道3天前您买的晨曦桃红，喝起来入口还习惯吗？这款酒是陈酿，记得低温保存，有任何问题的话随时找我哦。"
    edits: 去掉"这款酒是陈酿"（晨曦桃红是无年份酒，说法不准确）；"低温保存"改成产品库里的具体侍酒温度
  - scenario: aftercare
    situation: 客户上周买了黑中白 2013 准备收藏
    text: "上周带走的黑中白 2013 还满意吗？记得您说是想收着。它的适饮期到 2033 年，不着急，避光恒温放好就行。希望哪天打开时，它能帮您记起这一年。"
    original: "上周买的黑中白2013还满意吗？我记得您说放着是为了收藏。很多人说收藏是为了若干年后看到这些曾经的酒会勾起当年的一些回忆。希望这瓶酒能够为您组成一个特别的回忆。"
    edits: 加入一条和所购产品对应的实用建议（适饮期、保存）；保留"记起这一年"的情感落点
  - scenario: reactivation
    situation: 客户一年多没来，以前很喜欢白中白；白中白 2015 正在适饮期
    text: "您好，最近怎么样？还记得您以前常来看白中白。店里现在的白中白 2015 正在适饮期，矿物感很清晰，您有空的话来坐坐，我们开一支尝尝？"
    original: "您好，1年多没联系了，不知最近怎么样我还记着您以前总来店里看白中白，我们最近新上了白中白2015，现在正在试饮期，我为您留了一瓶。看您最近有空可以来看看尝尝吗？"
    edits: 去掉"1 年多没联系了"（R14 不提客户多久没来）；去掉"我为您留了一瓶"（R4 不承诺预留）；"试饮期"→"适饮期"
  - scenario: reactivation
    situation: 客户去年春节买了很多瓶送礼，之后没联系；今年春节快到了
    text: "又一年春节快到了，最近还好吗？去年您挑的那批酒，不知道朋友们喝着怎么样。今年要是还有送礼的打算，可以来咱们这儿先尝一尝再定。"
    original: "又一年春节快到了，最近怎么样？我们今年为春节打造了新一个主题的香槟礼盒。送朋友、家人都很合适，感兴趣的话，可以来咱们这里尝一尝。"
    edits: 去掉"新主题礼盒"（产品库里没有，属于编造，R3）；改为从客户去年的送礼经历说起
  - scenario: event_invitation
    situation: 邀请一位臻选客户参加 12 月 20 日上海沙龙圣诞品鉴晚宴，8 人，约 2 小时
    text: "王女士，这一年谢谢您的信任。12 月 20 日我们在上海沙龙办圣诞品鉴晚宴，8 位客人，约 2 小时，会配海鲜，经典款和新酒都有，大家一起聊聊。想请您来，您那天有空吗？"
    original: "您好，王女士，过去1年，感谢您的信任与支持。酒庄将在12月20日在上海沙龙圣诞举办品鉴晚宴，想邀请您作为我们的甄选客户来参加，会准备海鲜和我们的经典与新品，大家一起交流品鉴。大概2个小时。您有空吗？"
    edits: 补上人数；去掉"作为我们的臻选客户"（不在消息里点出客户层级）；措辞微调
  - scenario: event_invitation
    situation: 邀请一位刚买过第一瓶的新客参加周末沙龙开放品鉴日，随时到访，约 1 小时
    text: "上次带走的晨曦 Brut 还喜欢吗？这周末沙龙有开放品鉴日，经典款和应季的酒都会开，随时来都可以，大概 1 小时。上次聊天觉得您很有品味，很想听听您的感受，有兴趣来坐坐吗？"
    original: "您好，王女士。上次购买的那瓶酒，（酒名称）还满意吗？酒庄将在这周末举行沙龙开放品鉴日，会陈列我们最近新上的季节新品和经典款。上次聊的时候，看您很懂酒又有评委，所以想邀请您作为我们的珍贵客户来帮忙品鉴，随时到访都可以，约1个小时，您看有兴趣吗？"
    edits: 填入酒名；"有评委"推测为"有品味"；保留"想听听您的感受"这个让新客有参与感的好点子
  - scenario: price_objection
    situation: 客户看中潮汐 2008（¥8,800），说在免税店看到便宜一些
    text: "我明白，8800 的酒确实需要好好考虑。我们一直坚持全国统一价，也是希望每位客人拿到的都是同样的品质和保障，酒从酒庄到沙龙全程温控。要不您哪天来沙龙，我陪您一起尝尝，喝过再决定值不值。"
    original: "Linda，我明白，一支酒3800确实是需要考虑的价格。我们一直坚持全球统一价，也是希望每位客人拿到的都是同样的品质和保障。酒从酒庄到沙龙全程温控。3800代表的也是我们酒庄品质的保障。纪念日，要不您来沙龙，我陪您一起开一支尝尝，喝过再决定值不值。"
    edits: Jiayi 原文写的是测试用例 P01（Linda / 年份桃红 3800），为避免泄题，保留她的结构和措辞，换到本情境（潮汐 2008 / 免税店）；「全球统一价」→「全国统一价」（品牌设定是全国统一价，海外和免税渠道价格本来就不同）；去掉重复的「3800 代表品质保障」
  - scenario: price_objection
    situation: 客户想买白中白 2015（¥2,600），问能不能给个会员价
    text: "谢谢您一直支持我们～白中白 2015 我们是全国统一价，会员这边没有单独的价格，不过会员的心意我们放在体验上：品鉴会、瓶身刻字这些都可以安排。这瓶正在适饮期，您要是送人，刻上名字会很特别。"
    original: "（Claude 按 Jiayi 认可的回复风格整理，待确认）"
    edits: 结构：先感谢 → 温和说明没有会员价 → 转向真实存在的会员权益（品鉴会、刻字）
